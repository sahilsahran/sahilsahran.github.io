<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a3238"/>
      <stop offset="100%" stop-color="#181e22"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c4eef0"/>
      <stop offset="100%" stop-color="#8cd5dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Slate squircle badge matching ID Card aesthetic -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#4B6376" stroke-width="1.5" stroke-opacity="0.75"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#c4eef0" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Iconic SS monogram -->
  <text 
    x="32" 
    y="34.5" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
    font-size="26" 
    font-weight="900" 
    letter-spacing="1" 
    fill="url(#cyanGrad)" 
    text-anchor="middle" 
    dominant-baseline="central"
    filter="url(#shadow)"
  >SS</text>
</svg>
