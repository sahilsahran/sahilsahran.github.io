<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF7EF"/>
      <stop offset="100%" stop-color="#EBE0CE"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C72A3B"/>
      <stop offset="60%" stop-color="#B42332"/>
      <stop offset="100%" stop-color="#8F1622"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#4A3818" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cream squircle badge matching Scarlet Light theme -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#D6CBB8" stroke-width="1.5"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#B42332" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Iconic SS monogram in scarlet red -->
  <text 
    x="32" 
    y="34.5" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
    font-size="26" 
    font-weight="900" 
    letter-spacing="1" 
    fill="url(#redGrad)" 
    text-anchor="middle" 
    dominant-baseline="central"
    filter="url(#shadow)"
  >SS</text>
</svg>
